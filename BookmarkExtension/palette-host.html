<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color-scheme: light;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      color-scheme: light;
    }

    .bm-palette-error {
      box-sizing: border-box;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 16px;
      background: #fff8f8;
      color: #4a1414;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .bm-palette-error__title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 600;
      color: #7a1f1f;
    }

    .bm-palette-error__origin {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <script src="palette-host.js" type="module"></script>
</body>

</html>
