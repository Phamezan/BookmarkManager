# SearXNG configuration for the LAN-only BookmarkManager URL Migrator fallback.
# Docs: https://docs.searxng.org/admin/settings/ (settings schema)
#       https://docs.searxng.org/admin/settings/settings_server.html
#       https://docs.searxng.org/admin/settings/settings_search.html
#
# Mounted read-only at /etc/searxng/settings.yml by docker-compose.yml and merged over the
# image's default settings.yml, so only the overrides below are needed.
use_default_settings: true

server:
  # server.secret_key is supplied at runtime by the SEARXNG_SECRET environment variable
  # (documented at https://docs.searxng.org/admin/settings/settings_server.html). Never commit
  # a real secret. The compose file refuses to start until .env provides one.
  #
  # Internal LAN instance reached only by the API over the Compose network: no rate limiter or
  # bot detection. `limiter` would otherwise require valkey and reject the API's JSON calls, and
  # `public_instance` enables extra public-instance-only bot defenses.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # `/search?format=json` is required by SearxngSearchService. A format not listed here is
  # rejected with HTTP 403 (https://docs.searxng.org/dev/search_api.html).
  formats:
    - html
    - json

# General-web engines that can surface manga/manhwa/webtoon/novel reader pages.
# Names are the pinned image's engine names (searxng/searxng:2026.10.2-19ffbcd30,
# searx/settings.yml at commit 19ffbcd30): google, bing, brave, duckduckgo, startpage, mojeek, qwant.
# Engine list cross-checked against https://docs.searxng.org/user/configured_engines.html
# (docs build 2026.10.2+19ffbcd30).
#
# Production evidence from this host's IP: google and duckduckgo raise
# SearxEngineCaptchaException and brave requests fail, so all three are disabled to stop the run
# circuit from opening on engines that cannot answer. bing and startpage are the reliable defaults;
# mojeek and qwant are added as two more independent general-web indexes (qwant is disabled by
# default in the image, so it is explicitly enabled here).
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
