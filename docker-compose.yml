services:
  bookmarkmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BOOKMARK_MANAGER_IMAGE:-bookmarkmanager:local}
    container_name: bookmarkmanager
    ports:
      - "${BOOKMARK_MANAGER_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: "Data Source=/data/bookmarks.db"
      # Suwayomi runs on the home server and is joined to this Compose network
      # (bookmarkmanager_default) from its own ~/suwayomi/docker-compose.yml. The API reaches it
      # over that network; migrated bookmarks point at the browser-facing public URL instead.
      Suwayomi__BaseUrl: "${SUWAYOMI_BASE_URL:-http://suwayomi:4567}"
      Suwayomi__PublicBaseUrl: "${SUWAYOMI_PUBLIC_BASE_URL:-http://phamezan.capybara-pirarucu.ts.net:4567}"
    volumes:
      - ${BOOKMARK_MANAGER_DATA_DIR:-./data}:/data
    restart: unless-stopped

  # Internal search backend for URL Migrator fallback. Not published to the host: the API
  # reaches it at http://searxng:8080 over the Compose network. Settings live in
  # deploy/searxng/settings.yml (json format on, limiter/bot detection off).
  # SEARXNG_SECRET must be set in .env - generate with: openssl rand -hex 32
  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30
    container_name: searxng
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env - generate with: openssl rand -hex 32}"
      SEARXNG_BASE_URL: http://searxng:8080/
      # Config is mounted read-only; skip the entrypoint's chown so a deploy-time `git reset`
      # can still overwrite the repo checkout.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "7007:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  searxng-cache:
